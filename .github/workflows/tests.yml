name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        # Same toolchain as the lecture-notes deployment (du_electromagnetism/.github/workflows/deploy.yaml)
        run: |
          rustup update 1.90.0 && rustup default 1.90.0
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack@0.13.1
      - name: Build WebAssembly module
        run: wasm-pack build --target web -d out
        working-directory: maxwell
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: maxwell/out

  playwright:
    needs: build-wasm
    runs-on: ubuntu-latest
    # The reference images were generated with this exact browser build; keep the
    # image tag in step with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: maxwell/out
      - run: npm ci
      - name: Run tests
        run: npx playwright test
        env:
          HOME: /root
      - name: Upload report and diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
